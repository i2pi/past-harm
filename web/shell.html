<style>
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
/* the piece: always 16:9 landscape, the largest that fits, centred on black (fitCanvas) */
#canvas { position: fixed; display: block; background: #000; }
body.playing.idle #canvas { cursor: none; }
#start { position: fixed; inset: 0; color: #f2efe7; cursor: pointer;
  font-family: "PH-DIN", "Helvetica Neue", Helvetica, Arial, sans-serif; user-select: none;
  -webkit-tap-highlight-color: transparent; background: radial-gradient(ellipse at 70% 30%, #1d2a44 0%, #07090d 70%); }
/* the title: the piece's own (CoreText's setting, scaled, in title.c's layout), drawn by showTitle */
#tcan { position: absolute; display: block; }
#start .go { position: absolute; right: 4.5vmin; bottom: 4.5vmin; margin: 0; font-size: max(12px, 2.4vmin); letter-spacing: 0.04em; opacity: 0.75; }
/* tall or narrow screens: the hint at the top, clear of the title and the GitHub mark */
@media (max-aspect-ratio: 4/3) {
  #start .go { top: 4.5vmin; bottom: auto; left: 4.5vmin; right: calc(9vmin + max(22px, 3.2vmin)); }
}
#start.busy .go { opacity: 0.35; }
#start .go .fs { font-size: 0.86em; opacity: 0.7; }
#gh { position: fixed; top: 4.5vmin; right: 4.5vmin; width: 3.2vmin; height: 3.2vmin; min-width: 22px; min-height: 22px; color: #f2efe7;
  opacity: 0.7; transition: opacity 0.4s; z-index: 2; }
#gh:hover { opacity: 1; }
#gh svg { width: 100%; height: 100%; display: block; fill: currentColor; }
/* ---- the transport: across the top of the picture (the title has the bottom), while the pointer moves ---- */
#transport { position: fixed; z-index: 3; box-sizing: border-box; padding: 2.4% 3.2% 3.6em; color: #f2efe7;
  font-family: "PH-DIN", "Helvetica Neue", Helvetica, Arial, sans-serif; user-select: none; -webkit-user-select: none;
  background: linear-gradient(to bottom, rgba(0,0,0,0.62), rgba(0,0,0,0.28) 60%, rgba(0,0,0,0));
  opacity: 0; pointer-events: none; transition: opacity 0.6s; }
#transport.on { opacity: 1; pointer-events: auto; transition: opacity 0.15s; }
#transport .row { display: flex; align-items: baseline; gap: 1.6em; font-size: clamp(11px, 1.55vmin, 18px); }
#tp-play { all: unset; cursor: pointer; flex: none; align-self: center; display: grid; place-items: center; box-sizing: border-box;
  width: clamp(40px, 5.6vmin, 64px); height: clamp(40px, 5.6vmin, 64px); padding: 0.62em; border-radius: 50%;
  background: rgba(242,239,231,0.14); box-shadow: inset 0 0 0 1px rgba(242,239,231,0.35);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); -webkit-tap-highlight-color: transparent; transition: background 0.2s; }
#tp-play:hover, #tp-play:focus-visible { background: rgba(242,239,231,0.24); }
#tp-play svg { width: 100%; height: 100%; fill: currentColor; }
/* the timecode: D-DIN, every figure in a cell of its own (its figures are proportional) */
.tc { display: inline-flex; font-size: 1.6em; letter-spacing: 0; white-space: nowrap; }
.tc i { font-style: normal; display: inline-block; width: 0.56em; text-align: center; }
.tc i.s { width: 0.3em; }
.tc i.u { width: auto; padding: 0 0.28em 0 0.06em; font-size: 0.62em; opacity: 0.6; align-self: flex-end; padding-bottom: 0.18em; }
#tp-to { opacity: 0; transition: opacity 0.2s; }
#tp-to.on { opacity: 0.75; }
#tp-off { margin-left: auto; font-size: 1.05em; opacity: 0.6; letter-spacing: 0.04em; }
/* the shuttle: a tape head held at the centre; pushed right it goes forward,
   left back, and the further from centre the further it goes, exponentially */
#shuttle { position: relative; height: clamp(34px, 5.4vmin, 60px); margin-top: 0.4em; cursor: ew-resize; touch-action: none; }
#shuttle .line { position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(242,239,231,0.35); }
#shuttle .tick { position: absolute; top: 50%; width: 1px; height: 7px; margin-top: -3px; background: rgba(242,239,231,0.45); }
#shuttle .lab { position: absolute; top: 50%; margin-top: 8px; transform: translateX(-50%); font-size: clamp(9px, 1.15vmin, 13px); letter-spacing: 0.04em; opacity: 0.55; white-space: nowrap; }
#shuttle .mid { position: absolute; left: 50%; top: 50%; width: 1px; height: 15px; margin-top: -7px; background: rgba(242,239,231,0.7); }
#head { position: absolute; left: 50%; top: 50%; width: 9px; height: 26px; margin: -13px 0 0 -4.5px; border-radius: 2px;
  background: #f2efe7; box-shadow: 0 0 0 1px rgba(0,0,0,0.35), 0 0 12px rgba(242,239,231,0.35); transition: left 0.35s cubic-bezier(.2,.9,.3,1.25); }
#shuttle.drag #head { transition: none; }
/* in the black bar above a letterboxed picture (portrait), when it fits there */
#transport.bar { background: none; padding-bottom: 2.4%; }
/* narrow: the major marks only */
#transport.narrow .lab.minor { display: none; }
#msg { position: fixed; left: 4.5vmin; top: 4.5vmin; right: 4.5vmin; color: #f2efe7; font: max(12px, 2vmin) "PH-DIN", Helvetica, sans-serif; white-space: pre-wrap; }
</style>

<body>

</div>
<a id="gh" href="https://github.com/i2pi/past-harm" target="_blank" rel="noopener" aria-label="Source on GitHub" title="Source on GitHub"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg></a>

  <div class="row">

<script>
"use strict";
const RATE = 44100;
/* D-DIN, regular and bold, from bytes (a data: URL in @font-face is refused
   where the page's policy limits font sources, e.g. in sandboxed previews) */
const FONT_BYTES = {};				/* the fonts' bytes, for their metrics (titleLayout) */
const FONTS = [['__FONT_REGULAR__', '400'], ['__FONT_BOLD__', '700']].map(([b, w]) => {
  const bin = atob(b), u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  FONT_BYTES[w] = u;
  const f = new FontFace('PH-DIN', u.buffer, { weight: w });
  document.fonts.add(f);
  return f.load().catch((e) => console.warn('font', w, e));
});
let resolveReady;
var Module = {
  canvas: document.getElementById('canvas'),
  print: (t) => console.log(t), printErr: (t) => console.warn(t),
  ready: new Promise((r) => { resolveReady = r; }),
  onRuntimeInitialized: () => resolveReady(),
};
const ENGINE_WASM = "__ENGINE_WASM__";		/* audio.c + past + harm, built for the worklet */
const params = new URLSearchParams(location.search);

function b64bytes(s) { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
function fail(t) { document.getElementById('msg').textContent = t; console.error(t); }

/* ---- the music: an AudioWorklet running the engine's WebAssembly ---- */
const WORKLET = `
class Past extends AudioWorkletProcessor {
  constructor(o) {
    super();
    const stub = new Proxy({}, { get: () => () => 0 });
    const mod = new WebAssembly.Module(o.processorOptions.wasm);
    this.x = new WebAssembly.Instance(mod, { env: stub, wasi_snapshot_preview1: stub }).exports;
    if (this.x._initialize) this.x._initialize();
    this.x.aw_init(o.processorOptions.swing);
    this.size = this.x.aw_snap_size();
    this.sent = 0;
    this.port.postMessage({ start: currentFrame });
    this.port.onmessage = (e) => {
      const x = this.x, d = e.data;
      /* exact (restored from a checkpoint and run on) if it can; else the page
         computes the long jump and sends the engine state to install */
      if (d.seek !== undefined) { const ok = x.aw_seek_exact(d.seek); this.port.postMessage(ok ? { seeked: 1 } : { warp: d.seek }); }
      if (d.install !== undefined) {
        if (d.install.byteLength === x.aw_state_size()) { new Uint8Array(x.memory.buffer, x.aw_state_slot(), d.install.byteLength).set(new Uint8Array(d.install)); x.aw_install(); }
        this.port.postMessage({ seeked: 0 });
      }
    };
  }
  process(inputs, outputs) {
    const out = outputs[0], n = out[0].length, x = this.x;
    const p = x.aw_render(n), f = new Float32Array(x.memory.buffer, p, 2 * n);
    const L = out[0], R = out[1] || out[0];
    for (let i = 0; i < n; i++) { L[i] = f[2 * i]; R[i] = f[2 * i + 1]; }
    const have = x.aw_snaps() >>> 0;
    if (have !== this.sent) {
      const k = Math.min((have - this.sent) >>> 0, 64), buf = new Uint8Array(k * this.size);
      for (let j = 0; j < k; j++) {
        const idx = (have - k + j) >>> 0;
        buf.set(new Uint8Array(x.memory.buffer, x.aw_snap(idx), this.size), j * this.size);
      }
      this.sent = have;
      this.port.postMessage({ snaps: buf.buffer, size: this.size }, [buf.buffer]);
    }
    return true;
  }
}
registerProcessor('past', Past);
`;

let actx = null, startFrame = 0, audioNode = null;
Module.audibleFrame = function () {
  if (!actx) return 0;
  const lat = (actx.outputLatency || 0) + (actx.baseLatency || 0);
  return (actx.currentTime - lat) * RATE - startFrame;
};

async function startAudio(swing) {
  actx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: RATE, latencyHint: 'playback' });
  if (actx.sampleRate !== RATE) console.warn('sample rate', actx.sampleRate);
  /* a blob: URL fails from file:// (origin null); a data: URL works there and online */
  try { await actx.audioWorklet.addModule('data:text/javascript;base64,' + btoa(WORKLET)); }
  catch (e) { await actx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: 'text/javascript' }))); }
  const node = new AudioWorkletNode(actx, 'past', { numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [2],
    processorOptions: { wasm: b64bytes(ENGINE_WASM).buffer, swing } });
  node.port.onmessage = (e) => {
    const d = e.data;
    if (d.start !== undefined) { startFrame = d.start; return; }
    if (d.seeked !== undefined) { transport.seeked(d.seeked); return; }
    if (d.warp !== undefined) {						/* a long jump, computed here, off the audio thread */
      const p = Module._aw_warp(d.warp), n = Module._aw_state_size(), st = HEAPU8.slice(p, p + n);
      node.port.postMessage({ install: st.buffer }, [st.buffer]);
      return;
    }
    if (!d.snaps) { console.warn('worklet message', JSON.stringify(d)); return; }
    const all = new Uint8Array(d.snaps), slot = Module._aw_slot();
    if (Module._aw_main_snap_size() !== d.size) { fail('snapshot layout mismatch'); return; }
    for (let o = 0; o < all.length; o += d.size) { HEAPU8.set(all.subarray(o, o + d.size), slot); Module._aw_push(); }
  };
  node.connect(actx.destination);
  audioNode = node;
  await actx.resume();
}

/* ---- the canvas: CSS size (phones capped; ?px=W*H caps it) ---- */
const canvas = document.getElementById('canvas');
const mobile = /Mobi|Android|iPhone|iPad/.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.userAgent));
/* desktop: uncapped, every CSS pixel like the macOS window's points; phones: 720p */
const MAX_PX = +params.get('px') || (mobile ? 1280 * 720 : Infinity);
const iphone = /iPhone|iPod/.test(navigator.userAgent), standalone = navigator.standalone || matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches;
if (mobile) document.querySelector('#start .go').innerHTML = 'tap to begin &nbsp;·&nbsp; sound on' +
  (iphone && !standalone ? '<br><span class="fs">full screen: Share \u2192 Add to Home Screen</span>' : '');
function fitCanvas() {
  /* 16:9 landscape whatever the window's shape or orientation: the largest
     that fits, centred, with black bars */
  const vw = window.innerWidth, vh = window.innerHeight;
  const cw = Math.max(16, Math.floor(Math.min(vw, vh * 16 / 9))), ch = Math.max(9, Math.floor(cw * 9 / 16));
  canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
  canvas.style.left = Math.floor((vw - cw) / 2) + 'px'; canvas.style.top = Math.floor((vh - ch) / 2) + 'px';
  if (typeof transport !== 'undefined') transport.layout(Math.floor((vw - cw) / 2), Math.floor((vh - ch) / 2), cw, ch);
  /* CSS pixels, as the macOS app renders in points (?hidpi for device pixels:
     sharper, but the blur, glow and 1-pixel lines are then half as strong) */
  const dpr = params.has('hidpi') ? (window.devicePixelRatio || 1) : 1;
  let w = cw * dpr, h = ch * dpr;
  const s = Math.min(1, Math.sqrt(MAX_PX / (w * h)));
  w = Math.max(16, Math.round(w * s)); h = Math.max(16, Math.round(h * s));
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
}
let resizeTimer = 0;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(fitCanvas, 250); });
fitCanvas();

/* ---- the title: set here in D-DIN with title.c's layout (sizes from the
   frame height; PAST and HARM stacked by cap height; the credit lines by the
   font's ascent and descent, read from its own tables as CoreText does);
   whole lines, so the font's kerning applies, tracked like CoreText's kern
   attribute. Coverage in R, rows bottom-up. ---- */
function fontMetrics(u) {				/* hhea ascent / descent, OS/2 cap height, over the em */
  const v = new DataView(u.buffer), n = v.getUint16(4), t = {};
  for (let i = 0; i < n; i++) t[String.fromCharCode(...u.subarray(12 + 16 * i, 16 + 16 * i))] = v.getUint32(20 + 16 * i);
  const em = v.getUint16(t.head + 18);
  return { asc: v.getInt16(t.hhea + 4) / em, desc: -v.getInt16(t.hhea + 6) / em, cap: v.getInt16(t['OS/2'] + 88) / em };
}
function titleLayout(W, H) {
  if (!FONT_BYTES['400'] || !FONT_BYTES['700']) return null;
  const big = H * 0.14, small = H * 0.024, margin = H * 0.045, gap = H * 0.018, lead = big * 0.02, lsp = small * 1.35;
  const mb = fontMetrics(FONT_BYTES['700']), mr = fontMetrics(FONT_BYTES['400']);
  const a2 = mr.asc * small, d2 = mr.desc * small, cap = mb.cap * big;
  const c = document.createElement('canvas').getContext('2d', { willReadFrequently: true });
  /* PAST tracked so its T's stem stands on HARM's M's first stem (as title.c) */
  const lines = [['PAST', '700', big, big * (0.03 + 0.0085 / 3)], ['HARM', '700', big, big * 0.03],
                 ['Joshua Reich Generative Works 1996-2026', '400', small, small * 0.04], ['superchromat / i2pi', '400', small, small * 0.04]];
  const tracked = 'letterSpacing' in c;
  const set = (w, size, k) => { c.font = w + ' ' + size + 'px "PH-DIN"'; if (tracked) c.letterSpacing = k + 'px'; };
  const width = ([t, w, size, k]) => { set(w, size, k); return tracked ? c.measureText(t).width : c.measureText(t).width + k * [...t].length; };
  const wm = Math.max(...lines.map(width));
  const tx0 = Math.floor(margin), ty0 = Math.floor(margin);
  let tw = Math.ceil(wm + 4), th = Math.ceil(d2 + lsp + a2 + gap + cap + lead + cap + 4);
  if (tx0 + tw > W) tw = W - tx0;
  if (ty0 + th > H) th = H - ty0;
  if (tw <= 0 || th <= 0) return null;
  c.canvas.width = tw; c.canvas.height = th;
  c.fillStyle = '#000'; c.fillRect(0, 0, tw, th); c.fillStyle = '#fff'; c.textBaseline = 'alphabetic';
  const base = [2 + d2 + lsp + a2 + gap + cap + lead, 2 + d2 + lsp + a2 + gap, 2 + d2 + lsp, 2 + d2];	/* from the bottom, as title.c */
  lines.forEach(([t, w, size, k], i) => {
    set(w, size, k);
    if (tracked) c.fillText(t, 2, th - base[i]);
    else { let x = 2; for (const ch of t) { c.fillText(ch, x, th - base[i]); x += c.measureText(ch).width + k; } }
  });
  const img = c.getImageData(0, 0, tw, th).data, cov = new Uint8Array(tw * th);
  for (let y = 0; y < th; y++) for (let x = 0; x < tw; x++) cov[y * tw + x] = img[((th - 1 - y) * tw + x) * 4];
  return { tx0, ty0, tw, th, cov };
}
Module.titleMask = function (W, H, out) {
  const t = titleLayout(W, H);
  if (!t) return 0;
  const { tx0, ty0, tw, th, cov } = t, p = Module._malloc(tw * th);
  HEAPU8.set(cov, p);
  HEAP32[(out >> 2)] = tx0; HEAP32[(out >> 2) + 1] = ty0; HEAP32[(out >> 2) + 2] = tw; HEAP32[(out >> 2) + 3] = th; HEAP32[(out >> 2) + 4] = p;
  return 1;
};

/* the start page: the title exactly as the piece's first frame stamps it
   (frame pixels = CSS pixels, colour 242 239 231 at 94%) */
function showTitle() {
  const c = document.getElementById('tcan');
  if (!c) return;
  /* sized by the window's height, as in the piece, but never wider than the
     window allows (portrait, narrow): the layout is ~0.54 H wide with margins */
  /* set at the screen's own resolution (device pixels), so it is crisp on phones */
  const dpr = window.devicePixelRatio || 1, W = window.innerWidth, H = Math.min(window.innerHeight, W / 0.56);
  const t = titleLayout(Math.round(W * dpr), Math.round(H * dpr));
  if (!t) return;
  c.width = t.tw; c.height = t.th;
  c.style.width = t.tw / dpr + 'px'; c.style.height = t.th / dpr + 'px';
  c.style.left = t.tx0 / dpr + 'px'; c.style.bottom = t.ty0 / dpr + 'px';
  const g = c.getContext('2d'), img = g.createImageData(t.tw, t.th);
  for (let y = 0; y < t.th; y++) for (let x = 0; x < t.tw; x++) {
    const o = ((t.th - 1 - y) * t.tw + x) * 4;			/* rows bottom-up */
    img.data[o] = 242; img.data[o + 1] = 239; img.data[o + 2] = 231;
    img.data[o + 3] = Math.floor(t.cov[y * t.tw + x] * 0.94);
  }
  g.putImageData(img, 0, 0);
}
Promise.all(FONTS).then(showTitle);
window.addEventListener('resize', showTitle);

/* ---- the transport ---- */
var transport = (() => {			/* (var: fitCanvas runs before this) */
  const el = document.getElementById('transport'), sh = document.getElementById('shuttle'), head = document.getElementById('head');
  const nowEl = document.getElementById('tp-now'), toEl = document.getElementById('tp-to'), offEl = document.getElementById('tp-off');
  const play = document.getElementById('tp-play'), icon = document.getElementById('tp-icon');
  const YEAR = 365.25 * 86400, MIN_OFF = 2, MAX_OFF = 10 * YEAR, DEAD = 0.03;
  let enabled = false, paused = false, dragging = false, seeking = false, d = 0, hideT = 0, pendingTo = null;
  /* the head's displacement (-1..1) -> seconds: 2 s at the edge of the dead
     zone to ten years at the end, exponentially */
  const offsetOf = (x) => { const a = Math.abs(x); if (a < DEAD) return 0;
    return Math.sign(x) * MIN_OFF * Math.pow(MAX_OFF / MIN_OFF, (a - DEAD) / (1 - DEAD)); };
  const posOf = (t) => DEAD + (1 - DEAD) * Math.log(t / MIN_OFF) / Math.log(MAX_OFF / MIN_OFF);
  /* the scale's marks, both ways */
  const MINOR = new Set(['1m', '10m', '1w', '1mo']);
  [[10, '10s'], [60, '1m'], [600, '10m'], [3600, '1h'], [86400, '1d'], [7 * 86400, '1w'], [30 * 86400, '1mo'], [YEAR, '1y'], [MAX_OFF, '10y']].forEach(([t, l]) => {
    for (const s of [1, -1]) {
      const x = 50 + 50 * s * posOf(t), tk = document.createElement('div'), lb = document.createElement('div');
      tk.className = 'tick'; tk.style.left = x + '%';
      lb.className = MINOR.has(l) || (s < 0 && t === MAX_OFF) ? 'lab minor' : 'lab'; lb.style.left = x + '%'; lb.textContent = (s < 0 ? '\u2212' : '') + l;
      if (t === MAX_OFF) lb.style.transform = s > 0 ? 'translateX(-100%)' : 'translateX(0)';
      sh.append(tk, lb);
    }
  });
  const two = (n) => String(n).padStart(2, '0');
  function tcHTML(t) {								/* YYy DDDd HH:MM:SS:FF, FF at 60 a second */
    t = Math.max(0, t);
    const y = Math.floor(t / YEAR); let r = t - y * YEAR;
